# Reusable: on a version tag, build the sdist and wheel, record build provenance for them, and
# attach them to a GitHub Release. The build runs without any write permission; only the second
# job, which never runs project code, can write.
#
#   on:
#     push:
#       tags:
#         - "v*"
#   jobs:
#     release:
#       name: Release
#       permissions:
#         contents: write  # create the GitHub Release
#         id-token: write  # sign the provenance attestation
#         attestations: write  # store the provenance attestation
#       uses: Rakiura-Inc/.github/.github/workflows/release.yml@<sha>  # vX.Y.Z

name: "Release"

on:
  workflow_call:
    inputs:
      python-version:
        description: "The Python to build with."
        type: string
        default: "3.13"
      uv-version:
        description: "The uv version to install."
        type: string
        # renovate: datasource=pypi depName=uv
        default: "0.13.7"
      working-directory:
        description: "The project folder, relative to the repository root."
        type: string
        default: "."
      dry-run:
        description: "Build and check only: no attestation and no GitHub Release."
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    name: Build the sdist and wheel
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read  # check out the repository
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv ${{ inputs.uv-version }} & Python ${{ inputs.python-version }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # No cache for a release build: nothing from an earlier run can reach the artifacts.
          enable-cache: false
          python-version: ${{ inputs.python-version }}
          version: ${{ inputs.uv-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Build package
        run: uv build

      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! ls dist/*-"$version"-*.whl > /dev/null 2>&1; then
            echo "Tag $GITHUB_REF_NAME does not match the built version:" >&2
            ls dist >&2
            exit 1
          fi

      - name: Upload the built files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: ${{ inputs.working-directory }}/dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attest and attach to a GitHub Release
    needs: build
    if: ${{ !inputs.dry-run && github.ref_type == 'tag' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write  # create the release and upload its files
      id-token: write  # sign the provenance attestation (Sigstore, through GitHub's OIDC token)
      attestations: write  # store the provenance attestation on the repository

    steps:
      - name: Download the built files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Create the GitHub Release with the wheel and sdist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  # PyPI publishing goes here once Rakiura has a PyPI account (founder). Use trusted publishing:
  # a third job with `needs: build`, `environment: pypi` and `permissions: id-token: write` that
  # downloads dist/ and runs `uv publish`. No API token is ever stored.
